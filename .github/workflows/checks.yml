name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select relevant checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Test check selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Select suites
        id: scope
        run: python3 .github/scripts/select_checks.py

  backend:
    name: Backend checks
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate check selection
        env:
          DETECTION_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.backend }}
        run: |
          case "$DETECTION_RESULT:$RUN_CHECKS" in
            success:true) echo "Running backend checks." ;;
            success:false) echo "Backend suite is not needed for this change." ;;
            *) echo "::error::Change detection failed or returned an invalid scope."; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.backend == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: needs.changes.outputs.backend == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        if: needs.changes.outputs.backend == 'true'
        run: python -m pip install -e '.[dev]'
      - name: Check Python formatting
        if: needs.changes.outputs.backend == 'true'
        run: ruff format --check backend .github/scripts
      - name: Lint Python
        if: needs.changes.outputs.backend == 'true'
        run: ruff check backend .github/scripts
      - name: Run all backend tests
        if: needs.changes.outputs.backend == 'true'
        run: python -m pytest --durations=10

  frontend:
    name: Frontend checks
    needs: changes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Validate check selection
        working-directory: .
        env:
          DETECTION_RESULT: ${{ needs.changes.result }}
          RUN_CHECKS: ${{ needs.changes.outputs.frontend }}
        run: |
          case "$DETECTION_RESULT:$RUN_CHECKS" in
            success:true) echo "Running frontend checks." ;;
            success:false) echo "Frontend suite is not needed for this change." ;;
            *) echo "::error::Change detection failed or returned an invalid scope."; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.frontend == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        if: needs.changes.outputs.frontend == 'true'
        run: npm ci
      - name: Check frontend formatting
        if: needs.changes.outputs.frontend == 'true'
        run: npm run format:check
      - name: Lint frontend
        if: needs.changes.outputs.frontend == 'true'
        run: npm run lint
      - name: Build frontend
        if: needs.changes.outputs.frontend == 'true'
        run: npm run build
      - name: Run all frontend tests
        if: needs.changes.outputs.frontend == 'true'
        run: npm test
