[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gym-video-logger"
version = "0.1.0"
description = "Multi-user gym workout tracker and video processing PWA"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "Pillow>=13.0.0,<14",
  "pillow-heif>=1.1,<2",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.20,<2",
  "google-api-python-client>=2.150,<3",
  "google-auth-oauthlib>=1.2,<2",
  "requests>=2.32,<3",
  "cryptography>=50.0.2,<51",
  "certifi>=2026.10.18",
  "pyasn1>=0.6.5,<0.7",
  "pywebpush>=2.0,<3",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
markers = [
  "auth_flow: exercise real registration/login when creating authenticated fixture accounts",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/app/main.py" = ["B008"]
